<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qa-segnatura-flow preview</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ececf0; font-family: ui-sans-serif, system-ui, sans-serif; }
    main { width: min(94vw, 1200px); }
    img { display: block; width: 100%; height: auto; box-shadow: 0 24px 80px rgb(0 0 0 / .12); }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0b0d; }
      .light { display: none; } .dark { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <img class="light" src="./qa-segnatura-flow.light.svg" width="1200" height="675" alt="qa-segnatura-flow product motion, light theme">
    <img class="dark" src="./qa-segnatura-flow.dark.svg" width="1200" height="675" alt="qa-segnatura-flow product motion, dark theme">
  </main>
</body>
</html>
