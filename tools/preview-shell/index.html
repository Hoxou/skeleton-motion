<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Display Room - Skeleton Motion</title>
  <script>
    // Before first paint, so the chrome never flashes the wrong theme. Same
    // storage key as Docusaurus: the room follows the site's choice.
    document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <!-- src/preview.js replaces this with the run's room data. -->
  <!--ROOM_DATA--><script type="application/json" id="room-data">null</script><!--/ROOM_DATA-->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
